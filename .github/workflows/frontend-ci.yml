name: Frontend CI

on:
  workflow_call:
    secrets:
      VPS_HOST:
        required: false
      VPS_USERNAME:
        required: false
      VPS_SSH_KEY:
        required: false
      VPS_SSH_PORT:
        required: false
      VPS_DEPLOY_PATH:
        required: false
      PROD_VPS_HOST:
        required: false
      PROD_VPS_USERNAME:
        required: false
      PROD_VPS_SSH_KEY:
        required: false
      PROD_VPS_DEPLOY_PATH:
        required: false

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  deploy-frontend:
    name: Deploy Selected Frontend to Production
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Validate deployment credentials
        env:
          SSH_HOST: ${{ secrets.PROD_VPS_HOST || secrets.VPS_HOST }}
          SSH_KEY: ${{ secrets.PROD_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
        run: |
          test -n "$SSH_HOST" || { echo "Missing VPS host secret"; exit 1; }
          test -n "$SSH_KEY" || { echo "Missing VPS SSH key secret"; exit 1; }

      - name: Deploy only the changed frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VPS_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.PROD_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -eu

            REPO="${{ github.repository }}"
            DEPLOY_DIR="${{ secrets.PROD_VPS_DEPLOY_PATH || secrets.VPS_DEPLOY_PATH || '/home/ubuntu/stackstorm' }}"

            case "$REPO" in
              stackstormproject/stackstorm-frontend-customer)
                TARGET="customer"
                ;;
              stackstormproject/stackstorm-frontend-admin)
                TARGET="admin"
                ;;
              *)
                echo "Unsupported repository: $REPO"
                exit 1
                ;;
            esac

            SCRIPT="$DEPLOY_DIR/infra/deploy-frontend-safe.sh"
            test -x "$SCRIPT"
            echo "Deploying $TARGET frontend only"
            "$SCRIPT" "$TARGET"
