name: Frontend CI

on:
  workflow_call:
    secrets:
      STAGING_DEPLOY_HOOK:
        required: false
      PRODUCTION_DEPLOY_HOOK:
        required: false
      VPS_HOST:
        required: false
      VPS_USERNAME:
        required: false
      VPS_SSH_KEY:
        required: false
      VPS_SSH_PORT:
        required: false
      VPS_DEPLOY_PATH:
        required: false
      STAGING_VPS_HOST:
        required: false
      STAGING_VPS_USERNAME:
        required: false
      STAGING_VPS_SSH_KEY:
        required: false
      STAGING_VPS_DEPLOY_PATH:
        required: false
      PROD_VPS_HOST:
        required: false
      PROD_VPS_USERNAME:
        required: false
      PROD_VPS_SSH_KEY:
        required: false
      PROD_VPS_DEPLOY_PATH:
        required: false

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Trigger Staging Deploy Webhook
        if: ${{ (secrets.STAGING_VPS_SSH_KEY == '' && secrets.VPS_SSH_KEY == '') && secrets.STAGING_DEPLOY_HOOK != '' }}
        env:
          DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
        run: |
          echo "Triggering staging deploy webhook..."
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

      - name: Deploy to Staging VPS via SSH
        if: ${{ secrets.STAGING_VPS_SSH_KEY != '' || secrets.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_VPS_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.STAGING_VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.STAGING_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.STAGING_VPS_DEPLOY_PATH || secrets.VPS_DEPLOY_PATH || '/home/ubuntu/stackstorm' }}"
            REPO_NAME="${{ github.repository }}"
            TARGET_SERVICE="frontend-customer"
            if echo "$REPO_NAME" | grep -qi "admin"; then
              TARGET_SERVICE="frontend-admin"
            fi
            echo "🚀 Auto-deploying $TARGET_SERVICE ($REPO_NAME) to Staging VPS at $DEPLOY_DIR..."
            cd "$DEPLOY_DIR"

            if [ -f "./infra/deploy.sh" ]; then
              chmod +x ./infra/deploy.sh
              ./infra/deploy.sh "$TARGET_SERVICE" develop
            elif [ -f "./deploy.sh" ]; then
              chmod +x ./deploy.sh
              ./deploy.sh "$TARGET_SERVICE" develop
            else
              if [ "$TARGET_SERVICE" = "frontend-admin" ]; then
                [ -d "stackstorm-frontend-admin" ] && cd stackstorm-frontend-admin && git fetch origin develop && git checkout develop && git pull origin develop && cd ..
              else
                [ -d "frontend" ] && cd frontend && git fetch origin develop && git checkout develop && git pull origin develop && cd ..
              fi
              docker compose -f infra/docker-compose.prod.yml up -d --build --no-deps "$TARGET_SERVICE"
              docker image prune -f
            fi
            echo "✅ Staging $TARGET_SERVICE deployment complete!"

      - name: Verify Staging Deployment Credentials
        if: ${{ secrets.STAGING_VPS_SSH_KEY == '' && secrets.VPS_SSH_KEY == '' && secrets.STAGING_DEPLOY_HOOK == '' }}
        run: |
          echo "⚠️ Staging deployment skipped: No VPS SSH key (VPS_SSH_KEY) or deploy hook (STAGING_DEPLOY_HOOK) configured."
          exit 0

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Trigger Production Deploy Webhook
        if: ${{ (secrets.PROD_VPS_SSH_KEY == '' && secrets.VPS_SSH_KEY == '') && secrets.PRODUCTION_DEPLOY_HOOK != '' }}
        env:
          DEPLOY_HOOK: ${{ secrets.PRODUCTION_DEPLOY_HOOK }}
        run: |
          echo "Triggering production deploy webhook..."
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"

      - name: Deploy to Production VPS via SSH
        if: ${{ secrets.PROD_VPS_SSH_KEY != '' || secrets.VPS_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VPS_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.PROD_VPS_USERNAME || secrets.VPS_USERNAME || 'ubuntu' }}
          key: ${{ secrets.PROD_VPS_SSH_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.PROD_VPS_DEPLOY_PATH || secrets.VPS_DEPLOY_PATH || '/home/ubuntu/stackstorm' }}"
            REPO_NAME="${{ github.repository }}"
            TARGET_SERVICE="frontend-customer"
            if echo "$REPO_NAME" | grep -qi "admin"; then
              TARGET_SERVICE="frontend-admin"
            fi
            echo "🚀 Auto-deploying $TARGET_SERVICE ($REPO_NAME) to Production VPS at $DEPLOY_DIR..."
            cd "$DEPLOY_DIR"

            if [ -f "./infra/deploy.sh" ]; then
              chmod +x ./infra/deploy.sh
              ./infra/deploy.sh "$TARGET_SERVICE" main
            elif [ -f "./deploy.sh" ]; then
              chmod +x ./deploy.sh
              ./deploy.sh "$TARGET_SERVICE" main
            else
              if [ "$TARGET_SERVICE" = "frontend-admin" ]; then
                [ -d "stackstorm-frontend-admin" ] && cd stackstorm-frontend-admin && git fetch origin main && git checkout main && git pull origin main && cd ..
              else
                [ -d "frontend" ] && cd frontend && git fetch origin main && git checkout main && git pull origin main && cd ..
              fi
              docker compose -f infra/docker-compose.prod.yml up -d --build --no-deps "$TARGET_SERVICE"
              docker image prune -f
            fi
            echo "✅ Production $TARGET_SERVICE deployment complete!"

      - name: Verify Production Deployment Credentials
        if: ${{ secrets.PROD_VPS_SSH_KEY == '' && secrets.VPS_SSH_KEY == '' && secrets.PRODUCTION_DEPLOY_HOOK == '' }}
        run: |
          echo "⚠️ Production deployment skipped: No VPS SSH key (VPS_SSH_KEY) or deploy hook (PRODUCTION_DEPLOY_HOOK) configured."
          exit 0
